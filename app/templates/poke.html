<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Pokémon</title>
</head>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #2b2b2b;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #a4fc7e;
            text-shadow: 3px 3px 0px #7960B4;
            font-size: 2.5rem;
            margin-bottom: 40px;
        }

        .grid-pokemons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        article {
            background: #1a1a1a;
            border-radius: 15px 5px 25px 5px; 
            border: 2px dashed #7960B4;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s;
        }

        article:hover {
            transform: translateY(-8px);
            border-color: #a4fc7e; 
        }

        article img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            background-color: rgba(121, 96, 180, 0.2);
            border-radius: 50%;
            border: 2px dotted #a4fc7e;
            margin-bottom: 15px;
        }

        h2 {
            text-transform: capitalize;
            color: #a4fc7e;
            font-size: 1.4rem;
            margin: 0 0 15px 0;
        }

        .tipos {
            margin-bottom: 20px;
        }

        .tipos span {
            background-color: #7960B4;
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin: 0 4px;
            text-transform: capitalize;
            border: 1px solid #a4fc7e;
        }

        .btn-detalle {
            background-color: #7960B4;
            color: #a4fc7e;
            border: 2px solid #a4fc7e;
            padding: 10px 0;
            width: 100%;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            cursor: pointer;
            font-weight: bold;
            margin-top: auto;
            transition: all 0.3s;
            text-transform: uppercase;
            font-family: inherit;
        }

        .btn-detalle:hover {
            background-color: #a4fc7e;
            color: #2b2b2b;
            border-color: #7960B4;
            border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%;
        }
        
        a {
            width: 100%;
            text-decoration: none;
        }

        .btn-volver {
            display: block;
            width: 250px;
            text-align: center;
            background-color: #7960B4;
            color: #a4fc7e;
            border: 3px solid #a4fc7e;
            padding: 15px;
            margin: 50px auto 20px auto;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-volver:hover {
            background-color: #a4fc7e;
            color: #2b2b2b;
            border-color: #7960B4;
            border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%;
        }
    </style>

<body>

    <h1>Listado de Pokémon</h1>

    <div class="grid-pokemons">
    {% for pokemon in pokemons %}

        <article>

            <img src="{{ pokemon.sprites.front_default }}" alt="{{ pokemon.name }}">

            <h2>{{ pokemon.name }}</h2>

            <div class="tipos">
                {% for tipo in pokemon.types %}
                    <span>{{ tipo }}</span>
                {% endfor %}
            </div>

            <a href="{{ url_for('detalles_pok', id=pokemon.id) }}">
                <button class="btn-detalle">Inspeccionar</button>
            </a>

        </article>
        {% endfor %}
    </div>

    <a href="{{ url_for('inicio') }}" class="btn-volver">Volver al Inicio</a>

</body>
</html>
