<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Batallas Pokemon - Edición Peculiar{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    <header>
        <div class="barra-sesion">
    {% if session.get('trainer') %}
        <span>Entrenador: <strong>{{ session.trainer }}</strong></span>
        <a href="{{ url_for('logout') }}" class="btn-logout">Cerrar Sesión</a>
        </div>
        {% endif %}
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>{{ proyecto }} - {{ nombre }} - {{ anho }}</p>
    </footer>

</body>
</html>
