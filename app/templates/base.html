<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Batallas Pokemon - Edición Peculiar{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    {% if session.trainer %}
        <header class="barra-sesion">
            <span>Entrenador activo: <strong>{{ session.trainer }}</strong></span>
            <a href="{{ url_for('logout') }}" class="btn-logout">Cerrar Sesión</a>
        </header>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>{{ proyecto }} - {{ nombre }} - {{ anho }}</p>
    </footer>

</body>
</html>
