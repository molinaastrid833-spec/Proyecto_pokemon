{% extends 'base.html' %}

{% block content %}

    <h1>Batallas Pokemon</h1>
    <p class="intro">
        Descubre a los Pokémon más incomprendidos y únicos en el campo de batalla.
    </p>
    
    <div class="destacado">
        <span>Ejemplar del día:</span>
        <img src="{{ pokemon.sprites.front_default }}" alt="{{ pokemon.name }}">
        <span>{{ pokemon.name }}</span>
    </div>

    <div class="panel-bienvenida">
        
        <div class="multimedia">
            <img src="https://media1.tenor.com/m/lxuO3YHimn0AAAAd/pokemon-purugly.gif" alt="Purugly">
        </div>

        <form method="POST" action="{{ url_for('inicio') }}" class="formulario-entrenador">
            <label for="trainer">Identificación de Entrenador:</label>
            
            <input type="text" id="trainer" name="trainer" value="{{ trainer }}" placeholder="Tu nombre..." required>
            
            {% if error %}
                <p class="msj-error">{{ error }}</p>
            {% endif %}
            
            <button type="submit" class="btn-principal">Entrar al Catálogo</button>
        </form>

    </div>

{% endblock %}
