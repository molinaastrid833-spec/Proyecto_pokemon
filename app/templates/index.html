<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Batallas Pokemon - Edición Peculiar</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: 'Courier New', Courier, monospace; 
            background-color: #2b2b2b;
            color: #e0e0e0;
        }

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #a4fc7e; 
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #7960B4; 
        }

        p.intro {
            font-size: 1.2rem;
            color: #b0b0b0;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .multimedia {
            margin: 20px 0;
            border-radius: 5px 30px 5px 30px;
            border: 4px dashed #7960B4; 
            padding: 10px;
            background-color: #1a1a1a;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .multimedia img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 20px 5px 20px 5px;
        }

        .destacado {
            background-color: rgba(121, 96, 180, 0.2);
            border: 2px dotted #a4fc7e;
            border-radius: 50%;
            padding: 15px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .destacado img {
            width: 80px;
            height: 80px;
            image-rendering: pixelated; 
        }

        .destacado span {
            color: #a4fc7e;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: capitalize;
        }

        .btn-principal {
            background-color: #7960B4; 
            color: #a4fc7e; 
            font-size: 1.3rem;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            border: 3px solid #a4fc7e;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn-principal:hover {
            border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%;
            background-color: #a4fc7e;
            color: #2b2b2b;
            border-color: #7960B4;
            transform: scale(1.05);
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 15px;
            background-color: #1a1a1a;
            color: #7960B4;
            border-top: 2px solid #333;
        }
    </style>
</head>
<body>
    <main>

        <h1>Batallas Pokemon</h1>
        <p class="intro">
            Descubre a los Pokémon más incomprendidos y únicos en el campo de batalla.
        </p>

        <div class="multimedia">
            <img src="https://media1.tenor.com/m/lxuO3YHimn0AAAAd/pokemon-purugly.gif" alt="Purugly">
        </div>
    
        <div class="destacado">
            <span>Ejemplar del día:</span>
            <img src="{{ pokemon.sprites.front_default }}" alt="{{ pokemon.name }}">
            <span>{{ pokemon.name }}</span>
        </div>

        <a href="{{ url_for('list_pokemon') }}" style="text-decoration: none;">
            <button class="btn-principal">Ver el Catálogo</button>
        </a>

    </main>

    <footer>
        <p>{{ proyecto }} - {{ nombre }} - {{ anho }}</p>
    </footer>

</body>
</html>
